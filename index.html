<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#AB1D21">
<title>Daily Run</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Cpath d='M11 1l9 5v10l-9 5-9-5V6z' fill='%23AB1D21'/%3E%3Cpath d='M7 11.5l3 3 5-6' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first single column (HUD → week → now → timeline → side panels); two columns from 900px, timeline left, panels right. */
:root {
  --bg: #F6F3F3; --surface: #FFFFFF; --surface-2: #EFE9E9; --fg: #1D191A; --muted: #675E60; --line: #E0D7D8;
  --red: #AB1D21; --red-ink: #FFFFFF; --red-soft: #F7E4E4; --blue: #326380; --blue-soft: #E1EBF1;
  --good: #2A7548; --good-soft: #E0F0E6; --warn: #8F5500; --warn-soft: #F7EAD5;
  --shadow: 0 1px 2px rgba(60, 20, 22, .06), 0 4px 16px rgba(60, 20, 22, .05);
  --f-display: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131012; --surface: #1C181A; --surface-2: #262023; --fg: #F2ECEC; --muted: #A99EA0; --line: #362E31;
  --red: #E5545A; --red-ink: #FFFFFF; --red-soft: #3A1B1E; --blue: #84B3D0; --blue-soft: #1A2932;
  --good: #63C98F; --good-soft: #15291D; --warn: #E6AE58; --warn-soft: #2F2415;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #131012; --surface: #1C181A; --surface-2: #262023; --fg: #F2ECEC; --muted: #A99EA0; --line: #362E31;
  --red: #E5545A; --red-ink: #FFFFFF; --red-soft: #3A1B1E; --blue: #84B3D0; --blue-soft: #1A2932;
  --good: #63C98F; --good-soft: #15291D; --warn: #E6AE58; --warn-soft: #2F2415;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body); margin: 0; caret-color: transparent; -webkit-tap-highlight-color: transparent; }
textarea, input { caret-color: auto; }
button { font: inherit; color: inherit; -webkit-user-select: none; user-select: none; }
a { color: var(--blue); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 48px; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 11px/1.2 var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font: 600 17px/1.2 var(--f-display); letter-spacing: .01em; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px 12px; }
.brand { display: flex; align-items: center; gap: 8px; white-space: nowrap; font: 700 20px/1 var(--f-display); letter-spacing: .02em; }
.brand-mark { width: 22px; height: 22px; flex: none; }
.datenav { display: flex; align-items: center; gap: 4px; }
.iconbtn { width: 36px; height: 36px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; display: grid; place-items: center; cursor: pointer; }
.iconbtn:hover { border-color: var(--muted); }
.datelabel { font: 600 15px/1 var(--f-display); min-width: 92px; text-align: center; }
.todaybtn { height: 36px; padding-inline: 10px; border: 1px solid var(--red); color: var(--red); background: transparent; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }

/* HUD */
.hud { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; box-shadow: var(--shadow); }
.lvl { width: 54px; height: 60px; display: grid; place-items: center; background: var(--red); color: var(--red-ink); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); text-align: center; }
.lvl small { display: block; font: 600 9px/1 var(--f-body); letter-spacing: .12em; opacity: .85; }
.lvl b { display: block; font: 700 22px/1 var(--f-display); }
.xpwrap { min-width: 0; display: grid; gap: 6px; }
.xprow { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.xprow strong { color: var(--fg); font: 600 14px/1.2 var(--f-display); }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--red); border-radius: inherit; transition: width .4s ease; }
.bar.blue > i { background: var(--blue); }
.bar.good > i { background: var(--good); }
.streak { text-align: center; padding-left: 14px; border-left: 1px solid var(--line); }
.streak b { display: block; font: 700 26px/1 var(--f-display); }
.streak span { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }

/* banners */
.banners { display: grid; gap: 8px; margin-top: 12px; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; font-size: 14px; background: var(--blue-soft); color: var(--fg); }
.banner b { font-weight: 600; }
.banner.red { background: var(--red-soft); }
.banner.good { background: var(--good-soft); }
.banner.warn { background: var(--warn-soft); }
.banner svg { flex: none; margin-top: 2px; }

/* week strip */
.week { margin-top: 14px; display: grid; grid-template-columns: 32px repeat(7, minmax(0, 1fr)) 32px; gap: 4px; align-items: center; }
.wday { display: grid; justify-items: center; gap: 2px; padding: 6px 0 4px; border: 1px solid transparent; border-radius: 10px; background: none; cursor: pointer; position: relative; }
.wday:hover { background: var(--surface-2); }
.wday[aria-current="date"] { background: var(--surface); border-color: var(--line); box-shadow: var(--shadow); }
.wday .wl { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .05em; }
.wday .wr { position: relative; display: grid; place-items: center; }
.wday .wn { font: 600 12px/1 var(--f-display); position: absolute; inset: 0; display: grid; place-items: center; }
.wday.is-today .wl { color: var(--red); }
.wday .cls { position: absolute; bottom: 0; width: 4px; height: 4px; border-radius: 50%; background: var(--blue); }
.weekarrow { width: 32px; height: 32px; border: 0; background: none; border-radius: 8px; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
.weekarrow:hover { background: var(--surface-2); color: var(--fg); }

/* layout */
.grid { display: grid; gap: 16px; margin-top: 16px; }
.col { display: grid; gap: 16px; align-content: start; min-width: 0; }
@media (min-width: 900px) { .grid { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: start; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }

/* now card */
.now { background: var(--surface); border: 1.5px solid var(--red); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); display: grid; gap: 10px; }
.now-main { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.now-title { font: 600 20px/1.2 var(--f-display); }
.now-sub { color: var(--muted); font-size: 14px; }
.now-time { font: 500 13px/1 var(--f-mono); color: var(--red); }
.now-next { display: flex; gap: 8px; align-items: baseline; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 14px; color: var(--muted); min-width: 0; }
.now-next b { color: var(--fg); font-weight: 600; }

/* day summary */
.daysum { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.daysum-stats { display: flex; gap: 10px; align-items: center; }
.daysum-stats b { font: 600 18px/1 var(--f-display); }
.chipbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; cursor: pointer; font-weight: 500; }
.chipbtn[aria-pressed="true"] { background: var(--warn-soft); border-color: var(--warn); color: var(--fg); }

/* timeline */
.tl { list-style: none; margin: 10px 0 0; padding: 0; display: grid; }
.blk { display: grid; grid-template-columns: 50px minmax(0, 1fr) 48px; gap: 10px; align-items: center; padding: 9px 4px; border-top: 1px solid var(--line); }
.blk:first-child { border-top: 0; }
.blk-time { font: 500 13px/1.2 var(--f-mono); display: grid; color: var(--fg); }
.blk-time .end { color: var(--muted); font-size: 11px; }
.blk-title { font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.blk-sub { font-size: 13px; color: var(--muted); }
.blk-meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; margin-top: 2px; }
.dot { width: 8px; height: 8px; border-radius: 2px; background: var(--cat, var(--muted)); flex: none; }
.blk.muted .blk-title { font-weight: 400; color: var(--muted); }
.blk.muted .blk-time { color: var(--muted); }
.blk.is-now { background: var(--red-soft); border-radius: 8px; border-top-color: transparent; }
.blk.is-now + .blk { border-top-color: transparent; }
.blk.dim { opacity: .45; }
.blk.done .blk-title { color: var(--muted); }
.blk-main { display: block; position: relative; width: 100%; text-align: left; border: 0; background: none; padding: 0 22px 0 0; cursor: pointer; border-radius: 6px; }
.blk-sub { display: block; }
.blk-main .chev { position: absolute; right: 0; top: 4px; color: var(--muted); transition: transform .15s; }
.blk-main:hover .chev { color: var(--fg); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.blk-main[aria-expanded="true"] .chev { transform: rotate(180deg); }
.blk-detail { margin-top: 8px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); font-size: 13px; display: grid; gap: 8px; }
.blk-detail p { margin: 0; }
.golink { display: inline-flex; align-items: center; gap: 6px; justify-self: start; min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--blue); color: var(--blue); background: var(--surface); font-weight: 600; font-size: 13px; text-decoration: none; }
.golink:hover { background: var(--blue-soft); }
.now-detail { font-size: 14px; color: var(--muted); margin: 0; }
.chip { display: inline-flex; align-items: center; font: 600 10px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; padding: 4px 6px; border-radius: 4px; white-space: nowrap; }
.chip-now { background: var(--red); color: var(--red-ink); }
.chip-next { background: var(--surface-2); color: var(--fg); }
.chip-min { background: var(--warn-soft); color: var(--warn); }
.state { font: 600 11px/1 var(--f-body); padding: 4px 7px; border-radius: 99px; letter-spacing: .03em; white-space: nowrap; }
.state.on { background: var(--good-soft); color: var(--good); }
.state.ahead { background: var(--blue-soft); color: var(--blue); }
.state.behind { background: var(--warn-soft); color: var(--warn); }
.state.done { background: var(--good); color: var(--surface); }
.state.idle { background: var(--surface-2); color: var(--muted); }

/* tick */
.tick { width: 46px; height: 46px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; transition: background .15s, border-color .15s, transform .12s; }
.tick:hover { border-color: var(--red); }
.tick:active { transform: scale(.94); }
.tick svg path { stroke: var(--red-ink); stroke-dasharray: 22; stroke-dashoffset: 22; }
.tick[aria-pressed="true"] { background: var(--red); border-color: var(--red); }
.tick[aria-pressed="true"] svg path { stroke-dashoffset: 0; transition: stroke-dashoffset .25s ease .05s; }
.tick[aria-pressed="true"] { animation: pop .3s ease; }
.tick-spacer { width: 46px; }
@keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }

/* counters */
.ctrs { display: grid; gap: 4px; }
.ctr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding-block: 8px; border-top: 1px solid var(--line); }
.ctr:first-child { border-top: 0; }
.ctr-label { font-weight: 600; font-size: 14px; }
.ctr-course { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font: 600 18px/1 var(--f-display); }
.stepper button:hover { border-color: var(--muted); }
.stepper button { touch-action: manipulation; -webkit-touch-callout: none; }
.stepper .val { min-width: 44px; text-align: center; font: 600 16px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stepper .of { font-size: 12px; color: var(--muted); min-width: 34px; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 12px; cursor: pointer; font-size: 13px; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
textarea { width: 100%; min-height: 76px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); padding: 10px; font: 14px/1.4 var(--f-body); }
.linkbtn { border: 0; background: none; color: var(--blue); cursor: pointer; padding: 4px 0; font-size: 13px; text-decoration: underline; text-underline-offset: 2px; }

/* quests */
.lane { display: grid; gap: 10px; padding-block: 10px; border-top: 1px solid var(--line); }
.lane:first-of-type { border-top: 0; padding-top: 0; }
.quest { display: grid; gap: 5px; }
.quest-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.quest-name { font-weight: 600; font-size: 14px; min-width: 0; }
.quest-meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.quest.idle .quest-name { color: var(--muted); font-weight: 500; }

/* notes */
.notes { display: grid; gap: 10px; }
.note { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; }
.note:first-child { border-top: 0; padding-top: 0; }
.note-head { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.note-text { white-space: pre-wrap; font-size: 14px; overflow-wrap: anywhere; }
.empty { color: var(--muted); font-size: 14px; }

/* month */
.month { max-width: 360px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.month .mh { font-size: 10px; text-align: center; color: var(--muted); font-weight: 600; }
.mcell { aspect-ratio: 1; max-width: 100%; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; font: 500 11px/1 var(--f-mono); color: var(--muted); border: 0; cursor: pointer; padding: 0; }
.mcell.part { background: var(--red-soft); color: var(--fg); }
.mcell.met { background: var(--red); color: var(--red-ink); }
.mcell.today { outline: 2px solid var(--blue); outline-offset: 1px; }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

/* empty state + toasts */
.loading { display: grid; gap: 10px; padding: 20px; text-align: left; }
.ghost { height: 52px; border-radius: 8px; background: var(--surface-2); }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.2); z-index: 10; }
.levelup { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 11; }
.levelup-card { background: var(--surface); border: 2px solid var(--red); border-radius: 14px; padding: 18px 26px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.18); animation: rise .5s ease; }
.levelup-card b { display: block; font: 700 34px/1 var(--f-display); color: var(--red); }
@keyframes rise { from { transform: translateY(12px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
.foot { margin-top: 24px; font-size: 12px; color: var(--muted); text-align: center; }
.foot .linkbtn { font-size: 12px; }

/* GitHub sync settings */
.sync-modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(20, 12, 14, .45); overflow-y: auto; }
.sync-card { width: min(440px, 100%); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 14px; padding: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.2); display: grid; gap: 12px; font: 14px/1.45 var(--f-body); }
.sync-card h2 { font-size: 19px; }
.sync-card p { margin: 0; color: var(--muted); }
.sync-card label { display: grid; gap: 4px; font-weight: 600; font-size: 13px; }
.sync-card input { height: 40px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: var(--surface); color: var(--fg); font: 14px var(--f-mono); min-width: 0; }
.sync-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sync-err { color: var(--red); font-weight: 600; min-height: 1em; }
.sync-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.btn { height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
.btn.primary { background: var(--red); border-color: var(--red); color: var(--red-ink); }
.btn:disabled { opacity: .6; cursor: default; }
@media (max-width: 420px) {
  .hud { grid-template-columns: auto 1fr; }
  .streak { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 8px; justify-content: center; border-left: 0; border-top: 1px solid var(--line); padding: 8px 0 0; }
  .streak b { font-size: 20px; }
  .datelabel { min-width: 78px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="app">
  <div class="wrap">
    <div class="top"><div class="brand">Daily Run</div></div>
    <div class="panel loading">
      <h2>Loading your run</h2>
      <p class="empty">Today's blocks, your ticks, XP and the quest log sync from your GitHub repo. Once it loads, tap a block's square when you finish it.</p>
      <div class="ghost"></div><div class="ghost"></div><div class="ghost"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.umd.js" integrity="sha384-w94Y7k7ToXbmIx5Vi/LxHtprASwddoLhbR/0ZhekgNn8pP9VNRRHzmp2tqrALfKY" crossorigin="anonymous"></script>
<script id="dr-logic">
/* Pure planning logic: dates are 'YYYY-MM-DD' strings in Europe/Rome. */
var DR = (function () {
  var ROME = 'Europe/Rome';
  function parse(d) { var p = d.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
  function fmt(dt) { return dt.toISOString().slice(0, 10); }
  function addDays(d, n) { var t = parse(d); t.setUTCDate(t.getUTCDate() + n); return fmt(t); }
  function diffDays(a, b) { return Math.round((parse(b) - parse(a)) / 86400000); }
  function dow(d) { return parse(d).getUTCDay(); }
  function mondayOf(d) { var w = dow(d); return addDays(d, w === 0 ? -6 : 1 - w); }
  function romeNow(now) {
    var parts = new Intl.DateTimeFormat('en-CA', { timeZone: ROME, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(now || new Date());
    var g = function (t) { return parts.find(function (x) { return x.type === t; }).value; };
    return { date: g('year') + '-' + g('month') + '-' + g('day'), min: Number(g('hour')) * 60 + Number(g('minute')) };
  }
  function hm(s) { var p = s.split(':').map(Number); return p[0] * 60 + p[1]; }
  var LANE_CATS = ['engine', 'design', 'ixdf', 'gigcrawler', 'designlab', 'dbga'];

  function inRange(d, from, to) { return d >= from && d <= to; }
  function isClassDay(d, cfg) { return (cfg.dbgaDates || []).indexOf(d) >= 0; }
  function holidayOf(d, cfg) { return (cfg.holidays || []).find(function (h) { return inRange(d, h.from, h.to); }) || null; }

      var patch = {}; patch[c.field] = v;
      pendingProg.current[c.id] = Object.assign({}, pendingProg.current[c.id] || {}, patch);
      var np = Object.assign({}, progress); np[c.id] = Object.assign({}, progress[c.id], patch);
      setProgress(np);
      if (writer.current) writer.current.save('progress/' + c.id, patch, 'update', 500);
      var snap = {}; counterDefs().forEach(function (d) { snap[d.key] = d.key === c.key ? v : d.value; });
      snap.engineCourse = (L.laneCurrent(np, 'engine') || {}).id || null;
      snap.designCourse = (L.laneCurrent(np, 'design') || {}).id || null;
      saveDay(sel, { counters: snap }, 700);
      if (c.lane && v >= c.total) {
        var nx = L.laneCurrent(np, c.lane);
        say(c.course + ' complete. ' + (nx ? 'Next up: ' + nx.name : c.lane === 'design' ? 'The design slot goes to IxDF now.' : 'Lane clear.'));
      }
    }

    // now / next
    var curB = null, nextB = null;
    if (isToday) {
      plan.blocks.forEach(function (b) { if (b.s <= now.min && now.min < b.e) curB = b; });
      nextB = plan.blocks.find(function (b) { return b.s > now.min && b !== curB; }) || null;
    }
    var dimFor = function (b) { return badDay && b.tick && !(b.min || b.lane); };

    var mon = L.mondayOf(sel);
    var week = [0, 1, 2, 3, 4, 5, 6].map(function (i) { return L.addDays(mon, i); });

    function go(d) { setSel(d); try { history.replaceState(null, '', d === now.date ? location.pathname + location.search : '#d' + d); } catch (e) { } }

    var banners = [];
    if (sel < '2026-10-15') banners.push(html`<div class="banner"><${Info}/><span><b>The plan starts Thu 15 Oct.</b> Until then this is a preview of a regular day.</span></div>`);
    if (sel >= '2026-10-15' && sel <= '2026-10-18') banners.push(html`<div class="banner warn"><${Info}/><span><b>Chinese revision week.</b> HSK 2 books and the Udemy course resume on Mon 19 Oct.</span></div>`);
    if (plan.cls) banners.push(html`<div class="banner red"><${Info}/><span><b>DBGA class day, 14:00–18:00.</b> Morning as usual, design lectures on the train, rest in the evening.</span></div>`);
    if (plan.hol) banners.push(html`<div class="banner warn"><${Info}/><span><b>${plan.hol.label || 'Holidays'}.</b> ${plan.hol.note || 'Half pace. The minimum run is a full win.'}</span></div>`);
    if (plan.kind === 'saturday' && plan.season && !plan.hol) banners.push(html`<div class="banner"><${Info}/><span><b>Saturday season: ${plan.season.label}.</b> ${dm(plan.season.from)} – ${dm(plan.season.to)}${plan.season.goal ? ' · ' + plan.season.goal : plan.season.note ? ' · ' + plan.season.note : ''}</span></div>`);
    if (badDay) banners.push(html`<div class="banner warn"><${Info}/><span><b>Minimum run today.</b> Chinese, reading and one lane block. That counts as a full day for your streak.</span></div>`);
    if (st.minimum) banners.push(html`<div class="banner good"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="var(--good)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span><b>Minimum run banked.</b> ${isToday ? 'Streak safe for today.' : 'This day counts for the streak.'}</span></div>`);
    if (sync.state === 'error') banners.push(html`<div class="banner red"><${Info}/><span><b>Sync stopped.</b> ${sync.error} Your changes stay on this device until it works again. <button class="linkbtn" onClick=${DRSync.openSettings}>Open sync settings</button></span></div>`);
    else if (sync.state === 'offline' && sync.waiting > 0) banners.push(html`<div class="banner warn"><${Info}/><span><b>Offline.</b> ${sync.waiting === 1 ? '1 change' : sync.waiting + ' changes'} will reach GitHub when you're back online.</span></div>`);
    if (!cfg.dbgaDates && db) banners.push(html`<div class="banner warn"><${Info}/><span><b>No calendar loaded yet.</b> Class days, holidays and seasons appear once the tracker is set up.</span></div>`);
    if (err) banners.push(html`<div class="banner red"><${Info}/><span>${err}</span></div>`);

    var defs = counterDefs();
    var energy = day && day.energy;
    var lanes = ['engine', 'design', 'chinese', 'ixdf'];
    var allCourses = Object.keys(progress).map(function (k) { return progress[k]; });

    // month view
    var m0 = sel.slice(0, 8) + '01';
    var mFirst = L.mondayOf(m0), mCells = [];
    for (var i = 0; i < 42; i++) { var dd = L.addDays(mFirst, i); if (i >= 35 && dd.slice(0, 7) !== sel.slice(0, 7)) break; mCells.push(dd); }

    var shownNotes = allNotes ? notes : notes.slice(0, 4);

    return html`<div class="wrap">
      <header class="top">
        <div class="brand"><${Mark}/>Daily Run</div>
        <div class="datenav">
          ${!isToday && html`<button class="todaybtn" onClick=${function () { go(now.date); }}>Today</button>`}
          <button class="iconbtn" aria-label="Previous day" onClick=${function () { go(L.addDays(sel, -1)); }}><${Arrow} left/></button>
          <div class="datelabel num" aria-live="polite">${short(sel)}</div>
          <button class="iconbtn" aria-label="Next day" onClick=${function () { go(L.addDays(sel, 1)); }}><${Arrow}/></button>
        </div>
      </header>

      <section class="hud" aria-label="Level and streak">
        <div class="lvl" aria-label=${'Level ' + lv.level}><div><small>LEVEL</small><b class="num">${lv.level}</b></div></div>
        <div class="xpwrap">
          <div class="xprow"><span><strong class="num">${lv.into}</strong> / <span class="num">${lv.need}</span> XP to level ${lv.level + 1}</span><span class="num">${totalXp} total</span></div>
          <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax=${lv.need} aria-valuenow=${lv.into} aria-label="XP towards next level"><i style=${'width:' + (lv.into / lv.need * 100) + '%'}></i></div>
          <div class="xprow"><span>${isToday ? 'Today' : short(sel)}: <strong class="num">${st.xp}</strong> XP</span><span class="num">${st.done}/${st.tickable} blocks</span></div>
        </div>
        <div class="streak"><b class="num">${streakN}</b><span>day streak</span></div>
      </section>

      ${banners.length > 0 && html`<div class="banners">${banners}</div>`}

      <nav class="week" aria-label="Week">
        <button class="weekarrow" aria-label="Previous week" onClick=${function () { go(L.addDays(sel, -7)); }}><${Arrow} left/></button>
        ${week.map(function (d) {
          var p = L.buildDay(d, cfg, progress, days[d]), s = L.dayStats(p, days[d]);
          return html`<button key=${d} class=${'wday' + (d === now.date ? ' is-today' : '')} aria-current=${d === sel ? 'date' : undefined} aria-label=${short(d) + ': ' + s.done + ' of ' + s.tickable + ' blocks done' + (p.cls ? ', DBGA class' : '')} onClick=${function () { go(d); }}>
            <span class="wl">${fd(d, { weekday: 'short' }).slice(0, 2)}</span>
            <span class="wr"><${Ring} ratio=${s.ratio}/><span class="wn num">${Number(d.slice(8))}</span></span>
            ${p.cls && html`<span class="cls"></span>`}
          </button>`;
        })}
        <button class="weekarrow" aria-label="Next week" onClick=${function () { go(L.addDays(sel, 7)); }}><${Arrow}/></button>
      </nav>

      <div class="grid">
        <div class="col">
          ${isToday && html`<section class="now" aria-label="Right now">
            ${curB ? html`<div class="now-main">
                <div style="min-width:0">
                  <div class="now-time num">NOW · ${curB.start}${curB.end ? '–' + curB.end : ''}</div>
                  <div class="now-title">${curB.title}</div>
                  ${curB.sub && html`<div class="now-sub">${curB.sub}</div>`}
                  ${(curB.detail || curB.link) && html`<div style="display:grid;gap:8px;margin-top:8px">
                    ${curB.detail && html`<p class="now-detail">${curB.detail}</p>`}
                    ${curB.link && html`<${GoLink} link=${curB.link}/>`}
                  </div>`}
                </div>
                ${curB.tick && html`<button class="tick" aria-pressed=${ticked.indexOf(curB.id) >= 0 ? 'true' : 'false'} aria-label=${(ticked.indexOf(curB.id) >= 0 ? 'Undo ' : 'Tick ') + curB.title} onClick=${function () { toggle(curB); }}>${CHECK}</button>`}
              </div>
              ${curB.e > curB.s && curB.id !== 'sleep' && html`<div class="bar blue"><i style=${'width:' + Math.round((now.min - curB.s) / (curB.e - curB.s) * 100) + '%'}></i></div>`}`
            : html`<div><div class="now-time">BEFORE THE DAY STARTS</div><div class="now-title">Sleep well</div></div>`}
            ${nextB && html`<div class="now-next"><span class="chip chip-next">Next</span><span class="num">${nextB.start}</span><b style="min-width:0">${nextB.title}</b></div>`}
          </section>`}

          <section class="panel" aria-label="Day plan">
            <div class="daysum">
              <div class="daysum-stats"><${Ring} ratio=${st.ratio} size=${40}/><div><b class="num">${st.done}/${st.tickable}</b> <span class="empty">blocks</span><div class="eyebrow">${{ regular: 'Regular weekday', friday: 'Friday', class: 'DBGA class day', saturday: 'Saturday', sunday: 'Sunday' }[plan.kind]}</div></div></div>
              <button class="chipbtn" aria-pressed=${badDay ? 'true' : 'false'} onClick=${function () { lastAction.current = Date.now(); saveDay(sel, { badDay: !badDay }); }}>${badDay ? 'Back to the full plan' : 'Rough day? Go minimum'}</button>
            </div>
            <ol class="tl">
              ${plan.blocks.map(function (b) {
                var done = ticked.indexOf(b.id) >= 0, isCur = curB === b, isNext = nextB === b;
                var cat = CAT[b.cat];
                var more = !!(b.detail || b.link), oid = sel + ':' + b.id, open = more && openId === oid;
                var body = html`<span class="blk-title">${isCur && html`<span class="chip chip-now">Now</span>`}${isNext && html`<span class="chip chip-next">Next</span>`}<span>${b.title}</span>${badDay && b.tick && (b.min || b.lane) && html`<span class="chip chip-min">Minimum</span>`}${more && CHEV}</span>
                    ${b.sub && html`<span class="blk-sub">${b.sub}</span>`}
                    ${b.tick && html`<span class="blk-meta"><span class="dot" style=${'--cat:' + (cat ? cat[1] : 'var(--muted)')}></span>${cat ? cat[0] : ''} · <span class="num">+${b.xp} XP</span></span>`}`;
                return html`<li key=${b.id} class=${'blk' + (b.tick ? '' : ' muted') + (isCur ? ' is-now' : '') + (done ? ' done' : '') + (dimFor(b) ? ' dim' : '')}>
                  <div class="blk-time num"><span>${b.start}</span>${b.end && html`<span class="end">${b.end}</span>`}</div>
                  <div style="min-width:0">
                    ${more ? html`<button class="blk-main" aria-expanded=${open ? 'true' : 'false'} aria-controls=${'det-' + b.id} onClick=${function () { setOpenId(open ? null : oid); }}>${body}</button>` : body}
                    ${open && html`<div class="blk-detail" id=${'det-' + b.id}>${b.detail && html`<p>${b.detail}</p>`}${b.link && html`<${GoLink} link=${b.link}/>`}</div>`}
                  </div>
                  ${b.tick ? html`<button class="tick" aria-pressed=${done ? 'true' : 'false'} aria-label=${(done ? 'Undo ' : 'Tick ') + b.title} onClick=${function () { toggle(b); }}>${CHECK}</button>` : html`<span class="tick-spacer"></span>`}
                </li>`;
              })}
            </ol>
          </section>
        </div>

        <div class="col">
          <section class="panel" aria-label="Chinese today">
            <div class="panel-head"><h2>Chinese today</h2>${plan.chinese.override && html`<button class="linkbtn" onClick=${function () { saveDay(sel, { chineseOverride: false }); }}>Back to schedule</button>`}</div>
            ${plan.chinese.type === 'revision' && !plan.chinese.override
              ? html`<p class="empty" style="margin:0 0 10px">Revision week. Alternation starts Mon 19 Oct with the HSK 2 books.</p>` : ''}
            <div class="row">
              <div class="seg" role="group" aria-label="Chinese session type">
                <button aria-pressed=${plan.chinese.type === 'hsk' ? 'true' : 'false'} onClick=${function () { saveDay(sel, { chineseOverride: true, chineseType: 'hsk' }); }}>HSK 2 books</button>
                <button aria-pressed=${plan.chinese.type === 'udemy' ? 'true' : 'false'} onClick=${function () { saveDay(sel, { chineseOverride: true, chineseType: 'udemy' }); }}>Udemy</button>
              </div>
              <span class="empty" style="font-size:13px">${plan.chinese.override ? 'Changed for this day' : 'Alternates daily'}</span>
            </div>
          </section>

          <section class="panel" aria-label="Counters">
            <div class="panel-head"><h2>Progress counters</h2><span class="eyebrow">${isToday ? 'Saved to today' : 'Saved to ' + short(sel)}</span></div>
            ${defs.length === 0 ? html`<p class="empty">Your courses appear here once the tracker is set up.</p>` : html`<div class="ctrs">
              ${defs.map(function (c) {
                return html`<div class="ctr" key=${c.key}>
                  <div style="min-width:0"><div class="ctr-label">${c.label}</div><div class="ctr-course">${c.course}</div></div>
                  <${Stepper} c=${c} onSet=${function (v) { setCounter(c, v); }}/>
                </div>`;
              })}
            </div>`}
          </section>

          <section class="panel" aria-label="Energy and note">
            <div class="panel-head"><h2>Energy</h2></div>
            <div class="seg" role="group" aria-label="Energy">
              ${['Good', 'OK', 'Low'].map(function (e) { return html`<button key=${e} aria-pressed=${energy === e ? 'true' : 'false'} onClick=${function () { saveDay(sel, { energy: energy === e ? null : e }); }}>${e}</button>`; })}
            </div>
            <label class="eyebrow" for="day-note" style="display:block;margin:12px 0 6px">Note for ${isToday ? 'today' : short(sel)}</label>
            <${NoteBox} key=${sel} value=${(day && day.note) || ''} onSave=${function (v) { saveDay(sel, { note: v }, 800); }}/>
          </section>

          <section class="panel" aria-label="Quest log">
            <div class="panel-head"><h2>Quest log</h2><span class="eyebrow">Pace vs target</span></div>
            ${allCourses.length === 0 ? html`<p class="empty">Courses, targets and pace chips appear here once the tracker is set up.</p>` : lanes.map(function (ln) {
              var cs = allCourses.filter(function (c) { return c.lane === ln; }).sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
              if (!cs.length) return null;
              return html`<div class="lane" key=${ln}><div class="eyebrow">${LANE_NAMES[ln]}</div>
                ${cs.map(function (c) {
                  var pc = L.pace(c, now.date), pct = c.total ? Math.round((c.current || 0) / c.total * 100) : 0;
                  var cls = { 'on track': 'on', ahead: 'ahead', behind: 'behind', done: 'done' }[pc.state] || 'idle';
                  var label = { 'on track': 'On track', ahead: 'Ahead', behind: 'Behind', done: 'Done', queued: 'Queued', parked: 'Parked', none: '—' }[pc.state];
                  var idle = pc.state === 'queued' || pc.state === 'parked';
                  return html`<div class=${'quest' + (idle ? ' idle' : '')} key=${c.id}>
                    <div class="quest-top"><span class="quest-name">${c.name}</span><span class=${'state ' + cls}>${label}</span></div>
                    ${!idle && html`<div class=${'bar' + (pc.state === 'done' ? ' good' : '')}><i style=${'width:' + pct + '%'}></i></div>`}
                    <div class="quest-meta"><span class="num">${c.current || 0} / ${c.total} ${c.unit || ''}${c.id === 'ixdf' && c.courseName ? ' · ' + c.courseName + ' ' + (c.coursePct || 0) + '%' : ''}</span><span class="num">${c.status === 'parked' ? (c.note || 'Parked') : c.targetEarly ? dm(c.targetEarly) + ' – ' + dm(c.target) : c.target ? 'Target ' + dm(c.target) : ''}</span></div>
                  </div>`;
                })}
              </div>`;
            })}
          </section>

          <section class="panel" aria-label="Coach notes">
            <div class="panel-head"><h2>Coach notes</h2><span class="eyebrow">21:20 daily · Sun 15:20</span></div>
            ${notes.length === 0 ? html`<p class="empty">Your coach writes here every evening at 21:20 and on Sundays at 15:20.</p>`
              : html`<div class="notes">${shownNotes.map(function (n) {
                  return html`<article class="note" key=${n.id}><div class="note-head"><span class=${'state ' + (n.kind === 'weekly' ? 'ahead' : 'idle')}>${n.kind === 'weekly' ? 'Weekly' : 'Daily'}</span><span class="num">${n.date ? short(n.date) : ''}</span></div><div class="note-text">${n.text}</div></article>`;
                })}</div>
                ${notes.length > 4 && html`<button class="linkbtn" onClick=${function () { setAllNotes(!allNotes); }}>${allNotes ? 'Show fewer' : 'Show all ' + notes.length + ' notes'}</button>`}`}
          </section>

          <section class="panel" aria-label="Streak calendar">
            <div class="panel-head"><h2>${fd(m0, { month: 'long', year: 'numeric' })}</h2><span class="eyebrow">Streak calendar</span></div>
            <div class="month">
              ${['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(function (x) { return html`<span class="mh" key=${x}>${x}</span>`; })}
              ${mCells.map(function (d) {
                var inM = d.slice(0, 7) === sel.slice(0, 7), s = stats[d];
                var c = 'mcell' + (s && s.minimum ? ' met' : s && s.done ? ' part' : '') + (d === now.date ? ' today' : '');
                return html`<button key=${d} class=${c} style=${inM ? '' : 'opacity:.35'} aria-label=${short(d) + (s && s.minimum ? ', minimum met' : s && s.done ? ', partly done' : '')} onClick=${function () { go(d); }}>${Number(d.slice(8))}</button>`;
              })}
            </div>
            <div class="legend"><span><i style="background:var(--red)"></i>Minimum met</span><span><i style="background:var(--red-soft)"></i>Some blocks</span><span><i style="background:var(--surface-2)"></i>Nothing logged</span></div>
          </section>
        </div>
      </div>
      <p class="foot">Times are Europe/Rome. XP: 1 per 5 planned minutes, DBGA class 20. Bed at 22:00.<br/>
        <span>${{ synced: 'Synced with GitHub' + (sync.syncedAt ? ' at ' + new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Rome', hour: '2-digit', minute: '2-digit' }).format(sync.syncedAt) : ''), saving: 'Saving to GitHub…', offline: 'Offline, showing the last synced copy', error: 'Sync stopped', idle: 'Connecting to GitHub…' }[sync.state]}</span>
${' · '}<button class="linkbtn" onClick=${DRSync.openSettings}>Sync settings</button></p>
      ${toast && html`<div class="toast" role="status">${toast}</div>`}
      ${levelUp && html`<div class="levelup" role="status"><div class="levelup-card"><span class="eyebrow">Level up</span><b class="num">Level ${levelUp}</b></div></div>`}
    </div>`;
  }

  // − / + with hold-to-repeat: one tap moves 1, holding keeps counting; the value is saved once, on release.
  function Stepper(p) {
    var c = p.c;
    var vS = useState(c.value), v = vS[0], setV = vS[1];
    var hold = useRef(null), live = useRef(c.value);
    useEffect(function () { if (!hold.current) { live.current = c.value; setV(c.value); } }, [c.value]);
    function clamp(x) { return Math.max(0, Math.min(c.total, x)); }
    function bump(d) { live.current = clamp(live.current + d); setV(live.current); }
    function start(d, e) {
      if (e.button) return;
      e.preventDefault();
      try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) { }
      stop(false);
      live.current = v;
      bump(d);
      var h = hold.current = { t: 0 };
      h.t = setTimeout(function rep() { bump(d); h.t = setTimeout(rep, 70); }, 420);
    }
    function stop(commit) {
      var h = hold.current;
      if (!h) return;
      clearTimeout(h.t);
      hold.current = null;
      if (commit !== false && live.current !== c.value) p.onSet(live.current);
    }
    function onKey(d, e) { if (e.detail === 0) { live.current = clamp(c.value + d); setV(live.current); p.onSet(live.current); } }
    function btn(d, label, sign) {
      return html`<button aria-label=${label + ' ' + c.label} onPointerDown=${function (e) { start(d, e); }} onPointerUp=${function () { stop(); }}
        onPointerCancel=${function () { stop(); }} onLostPointerCapture=${function () { stop(); }} onContextMenu=${function (e) { e.preventDefault(); }}
        onClick=${function (e) { onKey(d, e); }}>${sign}</button>`;
    }
    return html`<div class="stepper">
      ${btn(-1, 'Decrease', '−')}
      <span class="val" aria-live="polite" aria-label=${c.label + ': ' + v + (c.suffix ? c.suffix : ' of ' + c.total)}>${v}</span>
      ${btn(1, 'Increase', '+')}
      <span class="of">${c.suffix ? c.suffix : '/ ' + c.total}</span>
    </div>`;
  }

  function NoteBox(p) {
    var s = useState(p.value), v = s[0], setV = s[1];
    var focused = useRef(false);
    useEffect(function () { if (!focused.current) setV(p.value); }, [p.value]);
    return html`<textarea id="day-note" placeholder="How did it go? Anything to remember tomorrow?" value=${v}
      onFocus=${function () { focused.current = true; }}
      onBlur=${function () { focused.current = false; if (v !== p.value) p.onSave(v); }}
      onInput=${function (e) { setV(e.target.value); }}></textarea>`;
  }

  var root = document.getElementById('app');
  root.textContent = '';
  H.render(html`<${App}/>`, root);
})();
</script>
</body>
</html>
